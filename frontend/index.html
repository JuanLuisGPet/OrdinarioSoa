<html lang="es">
<head>

        .tarjeta a:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>Plataforma Academica</h1>

    <div class="contenedor">
        <div class="tarjeta">
            <h2>Alumnos</h2>
            <p>Gestion de alumnos mediante servicio SOAP</p>
            <a href="alumnos.html">Ir a Alumnos</a>
        </div>

        <div class="tarjeta">
            <h2>Cursos</h2>
            <p>Gestion de cursos mediante servicio REST</p>
            <a href="cursos.html">Ir a Cursos</a>
        </div>
    </div>

</html>
